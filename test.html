<!DOCTYPE html>
<html>
<head>
<style>
.shadow-box {
  width: 200px;
  height: 50px;
  border-radius: 16px;
  box-shadow: 0px 8px 24px rgba(139, 163, 192, 1);
  background-color: transparent;
  margin: 50px;
}
.inner-box {
  width: 100%;
  height: 100%;
  border-radius: 16px;
  background-color: rgba(255,255,255, 0.5);
}
</style>
</head>
<body>
<div class="shadow-box">
  <div class="inner-box">Hello</div>
</div>
</body>
</html>
